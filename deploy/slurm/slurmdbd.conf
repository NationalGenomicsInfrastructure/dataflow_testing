# slurmdbd configuration for the dataflow-testing stack (Debian trixie
# slurmdbd 24.11.5, version-matched to slurmctld). Consumed by
# deploy/Dockerfile.slurmdbd.
#
# Note: 24.11 slurmdbd.conf parameter names (Storage* for the database,
# DbdHost/DbdPort for the daemon itself). The cluster/user bootstrap is
# NOT automatic in 24.11 (no AutoCreate): it is done once by the
# slurmdbd-bootstrap compose service (deploy/slurm/bootstrap-slurmdbd.sh).

AuthType=auth/munge

# Daemon identity / locations.
DbdHost=slurmdbd
DbdPort=6819
SlurmUser=slurm
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurmdbd.pid

# MariaDB backend (slurmdbd-db compose service).
StorageType=accounting_storage/mysql
StorageHost=slurmdbd-db
StorageLoc=slurm
StorageUser=slurm
StoragePass=secret
StoragePort=3306