# Single-node SLURM cluster for the dataflow-testing compose stack.
#
# Shared by all three SLURM-aware images (they must all run the same
# version of this file):
#   deploy/Dockerfile.slurm-ctld     (controller)
#   deploy/Dockerfile.slurmd         (compute node)
#   deploy/Dockerfile.yggdrasil.dind (client only: sbatch/sacct from the
#                                       yggdrasil daemon)
#
# Hostnames: SlurmctldHost/NodeName are the compose service names, and
# each container's hostname is set to match in docker-compose.yml.
#
# Auth: munge, with ONE shared key on the slurm-munge volume (created
# by the slurmctld entrypoint on first boot). The munge uid/gid is
# pinned to 1005 in every image so the key's ownership is consistent
# across the containers.

ClusterName=dataflow

# --- authentication / crypto -------------------------------------------
AuthType=auth/munge
CryptoType=crypto/munge

# --- users / directories ------------------------------------------------
# slurm is the package's service account; the spool dirs are package-owned.
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

# --- controller / node addressing ---------------------------------------
SlurmctldHost=slurmctld
SlurmctldPort=6817
SlurmdPort=6818

# --- restart behaviour ----------------------------------------------------
# With ReturnToService=2 a controller restart does not kill running jobs
# (the node re-registers) — keeps repeated make compose-up cycles sane.
ReturnToService=2
SlurmctldTimeout=300
SlurmdTimeout=300

# Accounting: slurmdbd (MariaDB-backed) — the same topology as a real HPC.
# Without accounting storage, sacct is disabled ("Slurm accounting storage
# is disabled"), and Yggdrasil's SlurmJobManager polls sacct for the job
# state. slurmdbd-db provides the MariaDB backend (see docker-compose.yml);
# the cluster/root user is created by the slurmdbd-bootstrap service
# (24.11 has no AutoCreate).
#
# NOTE: with auth/munge, AccountingStoragePass is NOT the database
# password — it is the munge socket the client uses for the "global"
# slurmctld<->slurmdbd auth key (see the AccountingStoragePass entry in
# slurm.conf(5)). The real DB password is StoragePass in slurmdbd.conf.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageUser=slurm
AccountingStoragePass=/run/munge/munge.socket.2
# jobcomp is the optional extra-data path (scripts, env); job records and
# states themselves flow to slurmdbd via AccountingStorageType above.
# Debian's 24.11 packages do not ship jobcomp/slurmdbd, and the test
# stack does not need job-comp data, so keep it off.
JobCompType=jobcomp/none

# --- job tracking / task plugins -----------------------------------------
# The set that the Debian slurm-* packages ship for every node.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/affinity
SelectType=select/linear
SchedulerType=sched/backfill
MpiDefault=none

# The node runs in a container: there is no systemd/dbus for the cgroup
# scope of slurmstepd (see /etc/slurm/cgroup.conf in the slurmd image,
# which disables cgroup management). The node's configured CPUs/RealMemory
# deliberately do not match the host hardware; slurmd logs a topology
# mismatch notice, which is expected in this setup.

# --- the single "compute node" -------------------------------------------
# Deliberately conservative CPU/memory: this simulates an HPC allocation,
# not the host machine. NodeName must equal the slurmd container
# hostname. Topology must satisfy
# CPUs = Boards*Sockets*CoresPerSocket*ThreadsPerCore.
NodeName=slurmd CPUs=4 RealMemory=4096 Sockets=1 CoresPerSocket=4 ThreadsPerCore=1 Boards=1

# Default (and only) partition, unlimited job time.
PartitionName=local Nodes=slurmd Default=YES MaxTime=INFINITE State=UP